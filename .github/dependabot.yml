version: 2
updates:
  # Package Ecosystem: Node.js Backend Server
  - package-ecosystem: "npm"
    directory: "/backend-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Package Ecosystem: React Admin Portal
  - package-ecosystem: "npm"
    directory: "/admin-portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Package Ecosystem: Appium Mobile Automation
  - package-ecosystem: "npm"
    directory: "/appium-test"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Package Ecosystem: Android Gradle Dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Package Ecosystem: GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

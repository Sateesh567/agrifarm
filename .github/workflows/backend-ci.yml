name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend-server/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend Node.js Express Tests & Security Scan
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agrifarm
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-server/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend-server
          npm ci

      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          mysql -h 127.0.0.1 -P 3306 -u root -proot agrifarm < database/schema.sql

      - name: Run Backend Integration & Unit Tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: agrifarm
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_1234567890
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_1234567890
        run: |
          cd backend-server/backend-tests
          npm ci
          npm test || true

      - name: Security Scan & Audit
        run: |
          cd backend-server
          npm audit --audit-level=high || true

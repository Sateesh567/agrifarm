name: Appium Mobile Automation Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'appium-test/**'
      - '.github/workflows/appium-tests.yml'
  workflow_dispatch:

jobs:
  appium-tests:
    name: Run Appium Android Tests
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20 & Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run Appium Tests
        run: |
          cd appium-test
          npm ci
          # Launch Appium Server in background & run tests
          appium --log appium.log &
          sleep 5
          npm test || true

      - name: Upload Appium Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            appium-test/*.xlsx
            appium-test/reports/
            appium-test/appium.log
          retention-days: 7

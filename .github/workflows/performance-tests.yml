name: Performance & Load Testing

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  performance-tests:
    name: Load Testing & Benchmark Analysis
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agrifarm
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Database Schema & Seed Data
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          mysql -h 127.0.0.1 -P 3306 -u root -proot agrifarm < database/schema.sql

      - name: Start Backend Server
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: agrifarm
          JWT_ACCESS_SECRET: perf_jwt_secret_12345
          JWT_REFRESH_SECRET: perf_jwt_refresh_secret_12345
        run: |
          cd backend-server
          npm ci
          node seed.js || true
          node server.js &
          sleep 5

      - name: Run Backend Load & Performance Test Suite
        run: |
          cd backend-server/backend-tests
          npm ci
          npx jest tests/performance.test.js --detectOpenHandles || true

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-reports
          path: |
            backend-server/backend-tests/performance-report.json
            backend-server/backend-tests/*.xlsx
          retention-days: 7

name: Selenium Web Automation Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'admin-portal/**'
      - '.github/workflows/selenium-tests.yml'
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Headless Chrome Selenium Automation Suite
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agrifarm
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable mariadb-client

      - name: Setup Database & Backend Server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: agrifarm
          JWT_ACCESS_SECRET: selenium_jwt_secret_test_12345
          JWT_REFRESH_SECRET: selenium_jwt_refresh_secret_test_12345
          PORT: 3000
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot agrifarm < database/schema.sql
          cd backend-server
          npm ci
          node seed.js || true
          node server.js &
          sleep 5

      - name: Start Admin Portal Application
        env:
          VITE_API_BASE_URL: http://localhost:3000/api
        run: |
          cd admin-portal
          npm ci
          npm run build
          npx serve -s dist -l 5173 &
          sleep 5

      - name: Execute Selenium E2E Tests
        run: |
          cd admin-portal/selenium-tests
          npm ci || true
          npm test || true

      - name: Upload Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            admin-portal/selenium-tests/screenshots/
            admin-portal/selenium-tests/*.xlsx
            admin-portal/selenium-tests/reports/
          retention-days: 7
